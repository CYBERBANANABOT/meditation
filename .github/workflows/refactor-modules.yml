name: Modularize the stable meditation app

on:
  push:
    branches: [main]
    paths: ['.github/workflows/refactor-modules.yml']

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Split only at existing section boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          assert text.count('<style>')==1 and text.count('</style>')==1
          assert text.count('<script>')==1
          assert text.count('</script>')==2, 'Telegram SDK plus one inline app'
          head,tail=text.split('<style>',1)
          css,tail=tail.split('</style>',1)
          text=head+'<link rel="stylesheet" href="./assets/style.css?v=20261011b">'+tail
          beginning,tail=text.split('<script>',1)
          script,trailing=tail.split('</script>',1)
          script=script.strip('\n')
          markers=[
            '/* ============================================================\n   ВСЕЛЕННАЯ',
            '/* ---------- Таймер ---------- */',
            '/* ---------- Заметка ---------- */'
          ]
          for m in markers:
            assert script.count(m)==1, 'Ambiguous module boundary: '+m
          idx=[script.index(m) for m in markers]
          assert 0<idx[0]<idx[1]<idx[2]<len(script)
          modules=[
            ('core',script[:idx[0]]),
            ('visualizer',script[idx[0]:idx[1]]),
            ('session',script[idx[1]:idx[2]]),
            ('ui',script[idx[2]:])
          ]
          asset_dir=Path('assets')
          for name,code in modules:
            out=asset_dir/(name+'.js')
            assert len(code)>2000, 'Unexpectedly empty module '+name
            out.write_text(code.strip()+'\n',encoding='utf-8')
            print(name,'JavaScript bytes:',out.stat().st_size)
          (asset_dir/'style.css').write_text(css.strip()+'\n',encoding='utf-8')
          print('CSS bytes:',(asset_dir/'style.css').stat().st_size)
          loader='\n'.join(
            '<script src="./assets/'+name+'.js?v=20261011b"></script>'
            for name,_ in modules
          )
          text=beginning+loader+trailing
          assert text.count('</script>')==5, 'Telegram SDK and four application scripts'
          assert text.count('<style>')==0
          assert 'user-scalable=no' not in text
          p.write_text(text,encoding='utf-8')
          readme=Path('README.md')
          info=readme.read_text(encoding='utf-8').rstrip()
          info += """

          ## Разработка и проверки

          Код разделён без изменения функций приложения:

          - assets/style.css — стили
          - assets/core.js — хранилище, настройки, общие данные
          - assets/visualizer.js — вселенная и дыхательная анимация
          - assets/session.js — таймер, музыка, завершение
          - assets/ui.js — экранные элементы, дневник и запуск приложения

          Скрипты подключаются именно в таком порядке, как обычный JavaScript в одной странице.
          Автоматические проверки: node --test tests/smoke.cjs
          GitHub Actions запускает тесты при каждом push в main и в pull request.
          Для обновления кешируемого кода в Telegram при крупных изменениях можно повышать
          версию ?v= в index.html.
          """
          readme.write_text(info,encoding='utf-8')
          PY
      - name: Run checks against every module and HTML
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/core.js assets/visualizer.js assets/session.js assets/ui.js; do
            node --check "$file"
          done
          node --test tests/smoke.cjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          names=['core','visualizer','session','ui']
          matches=re.findall(r'<script src="\./assets/(\w+)\.js\?v=20261011b"></script>',html)
          assert matches==names, ('Wrong script load order',matches)
          css=Path('assets/style.css').read_text(encoding='utf-8')
          js='\n'.join(Path('assets/'+n+'.js').read_text(encoding='utf-8') for n in names)
          assert '60 - 1.5' in js or '1000 / 60' in js
          assert 'requestAnimationFrame(animateOrb)' in js
          assert 'function mergeSessionLogs(' in js
          assert 'function armTimerDeadline()' in js
          assert 'function scanStepAt(' in js
          assert 'function playScanChime()' in js
          assert css.count('{')==css.count('}')
          assert not re.search(r'<script>\s*[^<]',html)
          print('Verified browser load order, app features and CSS balance')
          PY
      - name: Commit modules and tests to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refactor-modules.yml
          git add index.html README.md assets/style.css assets/core.js assets/visualizer.js assets/session.js assets/ui.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Organize meditation into four JS modules and CSS with permanent regression tests"
          git pull --rebase origin main
          git push origin HEAD:main
