name: Apply phase one reliability fixes

on:
  push:
    branches: [main]
    paths: ['.github/workflows/reliability-phase-one.yml']

permissions:
  contents: write

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Patch reliability, without changing visual style or audio
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          code = path.read_text(encoding='utf-8')

          def replace(old,new):
              global code
              count=code.count(old)
              if count!=1:
                  raise AssertionError('Expected one match, found '+str(count)+': '+repr(old[:120]))
              code=code.replace(old,new,1)

          # 1: Protect personal history. Reconcile by stable session ID, with
          # an explicit edit timestamp, instead of picking an entire device.
          replace(
              "let sessionCloudSlot = 'b';",
              """let sessionCloudSlot = 'b';
          let journalNeedsCloudSync = false;

          function parseJournal(raw) {
            if (!raw) return [];
            try {
              const entries = JSON.parse(raw);
              return Array.isArray(entries) ? entries : [];
            } catch (e) {
              console.warn('Invalid journal backup', e);
              return [];
            }
          }

          function mergeSessionLogs(...sources) {
            const byId = new Map();
            for (const source of sources) {
              if (!Array.isArray(source)) continue;
              for (const item of source) {
                if (!item || typeof item !== 'object' || !item.id || !Number.isFinite(Number(item.ts))) continue;
                const key = String(item.id);
                const prior = byId.get(key);
                if (!prior) { byId.set(key, item); continue; }
                const priorUpdated = Number(prior.updatedAt) || Number(prior.ts) || 0;
                const itemUpdated = Number(item.updatedAt) || Number(item.ts) || 0;
                const richness = record => (record.note ? 2 : 0) + (record.mood ? 1 : 0);
                // Newer edits win even if the user intentionally erased a note.
                // Legacy copies without updatedAt use the original session time;
                // on an equal timestamp retain the version with more information.
                if (itemUpdated > priorUpdated || (itemUpdated === priorUpdated && richness(item) > richness(prior))) {
                  byId.set(key, item);
                }
              }
            }
            return [...byId.values()].sort((a,b) => Number(a.ts)-Number(b.ts));
          }"""
          )

          replace(
              """function saveSessionLog() {
            const snapshot = JSON.stringify(sessionLog);
            try { localStorage.setItem('sessionLog', snapshot); } catch(e) { console.warn('Journal local backup:', e); }
            if (!tg?.CloudStorage) return;
            sessionSaveQueue = sessionSaveQueue.catch(() => {}).then(async () => {
              const chunks = chunkSessions(JSON.parse(snapshot));
              // Versioned chunk names avoid exposing a half-written journal.
              const version = sessionCloudSlot === 'a' ? 'b' : 'a';
              for (let i = 0; i < chunks.length; i++) await cloudSetP('log_' + version + '_' + i, chunks[i]);
              await cloudSetP('sessionLogManifest', JSON.stringify({version, count:chunks.length}));
              sessionCloudSlot = version;
            }).catch(e => { console.warn('Journal cloud sync failed', e); showToast('История сохранена на устройстве, но не синхронизирована'); });
          }""",
              """function saveSessionLog() {
            const snapshot = JSON.stringify(sessionLog);
            try { localStorage.setItem('sessionLog', snapshot); }
            catch(e) { console.warn('Journal local backup:', e); showToast('Не удалось сохранить историю на устройстве'); }
            if (!tg?.CloudStorage) return;
            sessionSaveQueue = sessionSaveQueue.catch(() => {}).then(async () => {
              const chunks = chunkSessions(JSON.parse(snapshot));
              // No silent trimming: cloud limits may be reached, but local data
              // remains intact and the last complete cloud snapshot stays valid.
              if (chunks.length > 400) throw Error('Telegram CloudStorage journal capacity reached');
              const version = sessionCloudSlot === 'a' ? 'b' : 'a';
              for (let i = 0; i < chunks.length; i++) await cloudSetP('log_' + version + '_' + i, chunks[i]);
              await cloudSetP('sessionLogManifest', JSON.stringify({version, count:chunks.length}));
              sessionCloudSlot = version;
            }).catch(e => { console.warn('Journal cloud sync failed', e); showToast('История сохранена локально, но не синхронизирована'); });
          }"""
          ) if False else None

          # Use a bounded block replacement so the original versioned cloud
          # protocol stays intact without relying on whitespace matching.
          old_save = code[code.index('function saveSessionLog() {'):code.index('async function loadSessionLog() {')]
          new_save = """function saveSessionLog() {
            const snapshot = JSON.stringify(sessionLog);
            try { localStorage.setItem('sessionLog', snapshot); }
            catch(e) { console.warn('Journal local backup:', e); showToast('Не удалось сохранить историю на устройстве'); }
            if (!tg?.CloudStorage) return;
            sessionSaveQueue = sessionSaveQueue.catch(() => {}).then(async () => {
              const chunks = chunkSessions(JSON.parse(snapshot));
              // No silent trimming: cloud limits may be reached, but local data
              // remains intact and the last complete cloud snapshot stays valid.
              if (chunks.length > 400) throw Error('Telegram CloudStorage journal capacity reached');
              const version = sessionCloudSlot === 'a' ? 'b' : 'a';
              for (let i = 0; i < chunks.length; i++) await cloudSetP(\`log_\${version}_\${i}\`, chunks[i]);
              await cloudSetP('sessionLogManifest', JSON.stringify({version, count:chunks.length}));
              sessionCloudSlot = version;
            }).catch(e => { console.warn('Journal cloud sync failed', e); showToast('История сохранена локально, но не синхронизирована'); });
          }
          """
          replace(old_save,new_save)

          old_load=code[code.index('async function loadSessionLog() {'):code.index('function storageGetP(key) {')]
          new_load="""async function loadSessionLog() {
            const local = parseJournal((() => { try { return localStorage.getItem('sessionLog'); } catch(e) { return null; } })());
            const legacy = parseJournal(await storageGetP('sessionLog'));
            const manifestRaw = await storageGetP('sessionLogManifest');
            let cloud = [];
            if (manifestRaw && tg?.CloudStorage) {
              try {
                const manifest = JSON.parse(manifestRaw);
                if (!Number.isInteger(manifest.count) || manifest.count < 0 || manifest.count > 400 ||
                    !/^[ab]$/.test(manifest.version)) throw Error('Invalid journal manifest');
                sessionCloudSlot = manifest.version;
                const batches = await Promise.all(
                  Array.from({length: manifest.count}, (_, i) => storageGetP(\`log_\${manifest.version}_\${i}\`))
                );
                if (batches.some(x => !x)) throw Error('Missing journal chunk');
                cloud = batches.flatMap(x => {
                  const entries = JSON.parse(x);
                  if (!Array.isArray(entries)) throw Error('Invalid journal chunk');
                  return entries;
                });
              } catch(e) {
                console.warn('Cloud journal recovery failed; preserving available local records', e);
                // Never overwrite an unreadable cloud snapshot automatically.
                return mergeSessionLogs(legacy, local);
              }
            }
            // Sources are ordered from cloud to local; edit timestamps and
            // richer legacy notes determine which duplicate is retained.
            const merged = mergeSessionLogs(cloud, legacy, local);
            journalNeedsCloudSync = !!tg?.CloudStorage && merged.length > 0 &&
              JSON.stringify(merged) !== JSON.stringify(cloud);
            try { localStorage.setItem('sessionLog', JSON.stringify(merged)); }
            catch(e) { console.warn('Local journal restore:', e); }
            return merged;
          }
          """
          replace(old_load,new_load)

          # 2: No surprise loss of old journal entries.
          replace("  if (sessionLog.length > 200) sessionLog = sessionLog.slice(-200);\n","")
          replace(
              "    note: '', mode: practiceMode",
              "    note: '', mode: practiceMode, updatedAt: Date.now()"
          )
          replace(
              "      s.note = text; s.mood = chosenMood;\n      saveSessionLog();",
              "      s.note = text; s.mood = chosenMood;\n      s.updatedAt = Date.now();\n      saveSessionLog();"
          )

          # 3: Recover an interrupted practice without crediting absent time.
          before_timer="""/* ---------- Таймер ---------- */
          let timerTotalSec = 600;"""
          recovery_helpers="""/* ---------- Таймер ---------- */
          // Recovery is device-local. Background / closed time is not credited.
          const ACTIVE_PRACTICE_KEY = 'meditation_active_practice_v1';
          let lastPracticeCheckpointMs = -Infinity;

          function readSavedPractice() {
            try {
              const saved = JSON.parse(localStorage.getItem(ACTIVE_PRACTICE_KEY) || 'null');
              if (!saved || saved.version !== 1 ||
                  !Number.isInteger(saved.durationSec) || saved.durationSec < 60 || saved.durationSec > 10800 ||
                  !Number.isFinite(saved.elapsedSec) || saved.elapsedSec <= 0 ||
                  saved.elapsedSec >= saved.durationSec ||
                  !Number.isFinite(saved.savedAt) || Date.now() - saved.savedAt > 7 * 86400000 ||
                  saved.savedAt > Date.now() + 60000 ||
                  !['scan','breath'].includes(saved.mode) ||
                  !CHAKRAS.some(c => c.key === saved.chakra)) return null;
              return saved;
            } catch (e) { console.warn('Practice recovery:', e); return null; }
          }
          function clearSavedPractice() {
            try { localStorage.removeItem(ACTIVE_PRACTICE_KEY); } catch(e) { console.warn('Clear practice:', e); }
          }
          function saveActivePractice() {
            if (timerDone || (!timerRunning && timerElapsed <= 0)) return;
            const elapsed = Math.max(0, Math.min(currentElapsed(), timerTotalSec - 0.001));
            if (elapsed <= 0) return;
            const saved = {
              version: 1, durationSec: timerTotalSec, elapsedSec: elapsed,
              mode: practiceMode, rhythmKey: currentRhythm.key,
              chakra: currentChakra, savedAt: Date.now()
            };
            try { localStorage.setItem(ACTIVE_PRACTICE_KEY, JSON.stringify(saved)); }
            catch(e) { console.warn('Save interrupted practice:', e); }
            lastPracticeCheckpointMs = performance.now();
          }
          function restoreSavedPractice(saved) {
            currentPresetMin = saved.durationSec / 60;
            timerTotalSec = saved.durationSec;
            timerElapsed = saved.elapsedSec;
            timerStartMs = null;
            timerRunning = false;
            timerDone = false;
            practiceMode = saved.mode;
            currentRhythm = allRhythms.find(r => r.key === saved.rhythmKey) || currentRhythm;
            currentChakra = saved.chakra;
            selectedGoal = getGoalForChakra(currentChakra)?.key || 'calm';
            renderPresets();
            renderPracticeUI();
            renderRhythmPicker();
            updateChakraUI();
            renderTimer();
            updateMainIcon();
            saveActivePractice();
            if (canAnimateOrb()) startOrbAnimation();
          }

          let timerTotalSec = 600;"""
          replace(before_timer,recovery_helpers)

          replace(
              "  timerInterval = setInterval(() => {\n    if (currentElapsed() >= timerTotalSec) finishTimer();\n    else renderTimer();\n  }, 200);",
              """  timerInterval = setInterval(() => {
              if (currentElapsed() >= timerTotalSec) finishTimer();
              else {
                renderTimer();
                if (performance.now() - lastPracticeCheckpointMs >= 4000) saveActivePractice();
              }
            }, 200);
            saveActivePractice();"""
          )
          replace(
              "  timerElapsed += (performance.now() - timerStartMs)/1000;\n  timerRunning = false;",
              "  timerElapsed += (performance.now() - timerStartMs)/1000;\n  timerRunning = false;\n  saveActivePractice();"
          )
          replace(
              "function finishTimer() {\n  clearInterval(timerInterval);",
              "function finishTimer() {\n  if (timerDone) return;\n  clearSavedPractice();\n  clearInterval(timerInterval);"
          )
          replace(
              "function resetTimer(newTotalSec) {\n  clearInterval(timerInterval);",
              """function resetTimer(newTotalSec, preserveRecovery = false) {
              if (!preserveRecovery) clearSavedPractice();
              clearInterval(timerInterval);"""
          )
          replace(
              "  if (timerDone) return;\n  if (timerRunning) {",
              "  if (timerDone) resetTimer(currentPresetMin * 60);\n  if (timerRunning) {"
          )
          replace(
              "    if (timerRunning && currentElapsed() >= timerTotalSec) finishTimer();",
              "    if (timerRunning && currentElapsed() >= timerTotalSec) finishTimer();"
          ) if False else None
          replace(
              "  if (document.hidden) stopOrbAnimation();",
              "  if (document.hidden) { saveActivePractice(); stopOrbAnimation(); }"
          )
          replace(
              "function pauseTimer() {",
              "window.addEventListener('pagehide', saveActivePractice);\nfunction pauseTimer() {"
          )

          # 4: A simple accessible resume prompt; no auto-start, no phantom
          # streak days, and no confirmation before user reads the welcome.
          insert="""<div class="modal" id="practiceRecoveryModal" role="dialog" aria-modal="true" aria-labelledby="practiceRecoveryTitle">
            <div class="modal-content" style="max-width:400px;">
              <div class="modal-header"><h2 id="practiceRecoveryTitle">Продолжить медитацию?</h2></div>
              <p class="note-subtitle" id="practiceRecoveryDescription"></p>
              <p class="note-subtitle">Практика будет восстановлена на паузе. Время, пока приложение было закрыто, не учитывается.</p>
              <div class="note-actions">
                <button type="button" class="ghost" id="practiceRecoveryDiscard">Начать заново</button>
                <button type="button" class="primary" id="practiceRecoveryResume">Восстановить</button>
              </div>
            </div>
          </div>

          <div class="modal" id="noteModal">"""
          replace('<div class="modal" id="noteModal">',insert)

          replace(
              "/* ---------- Нижняя навигация ---------- */",
              """function offerPracticeRecovery(saved) {
                const dialog = document.getElementById('practiceRecoveryModal');
                const minutesLeft = Math.ceil((saved.durationSec - saved.elapsedSec) / 60);
                document.getElementById('practiceRecoveryDescription').textContent =
                  \`Есть незавершённая практика: осталось примерно \${minutesLeft} мин.\`;
                const close = () => dialog.classList.remove('show');
                document.getElementById('practiceRecoveryResume').onclick = () => {
                  restoreSavedPractice(saved);
                  close();
                  showToast('Практика восстановлена на паузе', 'success');
                };
                document.getElementById('practiceRecoveryDiscard').onclick = () => {
                  clearSavedPractice();
                  close();
                  showWelcomeThought();
                };
                dialog.classList.add('show');
                document.getElementById('practiceRecoveryResume').focus();
              }

          /* ---------- Нижняя навигация ---------- */"""
          )
          replace(
              "m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); });",
              """m.addEventListener('click', e => {
                if (e.target === m && m.id !== 'practiceRecoveryModal') m.classList.remove('show');
              });"""
          )
          replace(
              "  if (allTracks.length) loadTrack(0, false);\n  else updateTrackStatus();\n  showWelcomeThought();",
              """  if (allTracks.length) loadTrack(0, false);
              else updateTrackStatus();
              if (journalNeedsCloudSync) saveSessionLog();
              const recovery = readSavedPractice();
              if (recovery) offerPracticeRecovery(recovery);
              else showWelcomeThought();"""
          )
          replace(
              "  resetTimer(currentPresetMin * 60);\n  renderStreak();\n  updateChakraUI();",
              "  resetTimer(currentPresetMin * 60, true);\n  renderStreak();\n  updateChakraUI();"
          )

          # Reconciliation and practice recovery must never change the music
          # playlist or the universe's 60-fps animation implementation.
          assert code.count('assets/peace-of-mind.mp3') == 1
          assert 'assets/rain-meditation.mp3' not in code
          assert 'assets/stream-meditation.mp3' not in code
          assert "  if (sessionLog.length > 200)" not in code
          assert "if (timerDone) resetTimer(currentPresetMin * 60)" in code
          assert "window.addEventListener('pagehide', saveActivePractice)" in code
          assert 'scanStepAt(secondsInCycle, timerTotalSec)' in code
          path.write_text(code,encoding='utf-8')
          print('Patched timer, recovery, journal merge, history retention')
          PY
      - name: Automated JavaScript and regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=[x for x in re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',html,flags=re.I) if x.strip()]
          assert len(scripts)==1
          Path('/tmp/meditation-audit-test.js').write_text(scripts[0],encoding='utf-8')
          for element in ['practiceRecoveryResume','practiceRecoveryDiscard','practiceRecoveryModal']:
              assert 'id="'+element+'"' in html
          PY
          node --check /tmp/meditation-audit-test.js
          node <<'JS'
          const vm = require('node:vm'), fs = require('node:fs'), assert = require('node:assert/strict');
          const code = fs.readFileSync('/tmp/meditation-audit-test.js','utf8');
          function extract(name) {
            const match = code.match(new RegExp('function '+name+'\\([^]*?\\n\\}'));
            assert(match,'Missing '+name);
            return match[0];
          }
          const ctx = {console,Date, CHAKRAS:[{key:'muladhara'}], localStorage:{
            values:new Map(),
            getItem(k){return this.values.get(k)||null},
            setItem(k,v){this.values.set(k,v)},
            removeItem(k){this.values.delete(k)}
          }};
          vm.runInNewContext([extract('mergeSessionLogs'),extract('parseJournal')].join('\n')+
            '\nthis.merge = mergeSessionLogs; this.parse = parseJournal;',ctx);
          const merge = ctx.merge;
          const cloud=[{id:1,ts:1000,note:'',mood:''},{id:2,ts:2000,note:'cloud'}];
          const local=[{id:1,ts:1000,note:'offline edit',mood:'calm',updatedAt:5000},{id:3,ts:3000,note:'local only'}];
          let all = merge(cloud,local);
          assert.equal(all.length,3,'Merging must keep both-device histories');
          assert.equal(all[0].note,'offline edit','Offline note edits must win');
          assert.deepEqual(Array.from(all.map(s=>s.id)),[1,2,3]);
          assert.equal(merge([{id:1,ts:1000,note:'old'}],[{id:1,ts:1000,note:'',updatedAt:4000}])[0].note,
            '', 'Intentional note deletion should not be undone');
          assert.equal(merge([{id:7,ts:1000,note:''}],[{id:7,ts:1000,note:'recovered'}])[0].note,'recovered');
          assert.equal(ctx.parse('invalid').length,0);
          assert.equal(ctx.parse('[]').length,0);

          // Recovery checks are also run using the real app functions, with
          // browser globals replaced by a tiny memory-backed test double.
          const recoveryCtx = {
            console,Date,
            localStorage:ctx.localStorage,
            CHAKRAS:[{key:'muladhara'}],
            currentRhythm:{key:'4-4'},currentChakra:'muladhara',practiceMode:'scan',
            timerTotalSec:60,timerElapsed:22,timerRunning:false,timerDone:false,
            performance:{now:()=>10000}
          };
          vm.runInNewContext(
            "const ACTIVE_PRACTICE_KEY = 'meditation_active_practice_v1'; let lastPracticeCheckpointMs = -Infinity;\n"+
            extract('currentElapsed')+'\n'+extract('readSavedPractice')+'\n'+
            extract('clearSavedPractice')+'\n'+extract('saveActivePractice')+
            '\nthis.read=readSavedPractice; this.save=saveActivePractice; this.clear=clearSavedPractice;',
            recoveryCtx
          );
          recoveryCtx.save();
          const saved = recoveryCtx.read();
          assert.equal(saved.elapsedSec,22);
          assert.equal(saved.durationSec,60);
          assert.equal(saved.mode,'scan');
          // A crash/restart and time spent closed do not advance saved elapsed.
          assert.equal(recoveryCtx.read().elapsedSec,22);
          recoveryCtx.clear();
          assert.equal(recoveryCtx.read(),null);
          recoveryCtx.localStorage.setItem('meditation_active_practice_v1',JSON.stringify({...saved,elapsedSec:60}));
          assert.equal(recoveryCtx.read(),null,'Never restore a completed practice');
          assert(code.includes('if (timerDone) resetTimer(currentPresetMin * 60)'), 'Replay after completion');
          assert(!code.includes('sessionLog.slice(-200)'), 'Never silently truncate notes');
          assert(code.includes('pagehide'), 'Persist when Telegram closes');
          assert(code.includes('scanStepAt(secondsInCycle, timerTotalSec)'),'12-stage synchronization');
          assert(code.includes("assets/peace-of-mind.mp3"),'Default music');
          console.log('PASS: history merge, offline edits, deletion, data retention, recovery, repeat meditation, body scan');
          JS
      - name: Commit tested changes and remove one-shot build tools
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reliability-phase-one.yml
          git rm .github/workflows/fix-body-scan-timing.yml
          git add index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Make meditation sessions repeatable and recoverable; preserve journal edits"
          git pull --rebase origin main
          git push origin HEAD:main
