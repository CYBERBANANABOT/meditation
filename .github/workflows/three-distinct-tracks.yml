name: Publish three independent meditation tracks

on:
  push:
    branches: [main]
    paths: ['.github/workflows/three-distinct-tracks.yml']

permissions:
  contents: write

jobs:
  create-distinct-music:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download separately composed music and real natural sounds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/meditation-sources
          curl -fL --retry 3 --max-time 240 \
            -o /tmp/meditation-sources/rain-music.mp3 \
            'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Wisps%20of%20Whorls.mp3'
          curl -fL --retry 3 --max-time 240 \
            -o /tmp/meditation-sources/stream-music.mp3 \
            'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Ethereal%20Relaxation.mp3'
          curl -fL --retry 3 --max-time 150 \
            -o /tmp/meditation-sources/rain.ogg \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Sound_of_light_rainfall.ogg'
          curl -fL --retry 3 --max-time 150 \
            -o /tmp/meditation-sources/stream.ogg \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Sound_Effects_-_The_sound_of_a_small_stream.ogg'
          for p in /tmp/meditation-sources/*; do
            echo "VERIFY $p"
            test "$(stat -c%s "$p")" -gt 150000
            ffprobe -v error -show_entries format=duration,size \
              -of default=noprint_wrappers=1 "$p"
          done
      - name: Mix two different new soundtracks with natural rain and stream
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import hashlib

          base = Path('/tmp/meditation-sources')
          def ff(*args):
              subprocess.run(['ffmpeg','-nostdin','-hide_banner','-loglevel','error','-y',*map(str,args)],check=True)
          def length(p):
              return float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(p)],text=True).strip())
          def filehash(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for c in iter(lambda: f.read(1024*1024),b''): h.update(c)
              return h.hexdigest()

          assert 840 < length(base/'rain-music.mp3') < 875, 'Expected Wisps of Whorls, not another composition'
          assert 1670 < length(base/'stream-music.mp3') < 1710, 'Expected Ethereal Relaxation'
          assert 50 < length(base/'rain.ogg') < 70, 'Expected 1-min actual rain'
          assert 28 < length(base/'stream.ogg') < 37, 'Expected 32-sec actual stream'
          assert len({filehash(base/'rain-music.mp3'),filehash(base/'stream-music.mp3'),filehash(Path('assets/peace-of-mind.mp3'))}) == 3, 'Music sources must differ'

          # Build a smooth, long-repeat field recording, instead of using
          # a short synthetically generated noise oscillator.
          def make_nature_loop(name, fade_seconds):
              path=base/(name+'.ogg')
              secs=length(path)
              assert fade_seconds < secs/4
              edge=2*fade_seconds
              cutoff=secs-edge
              assert cutoff > edge, f'Audio source too short for crossfade: {name}'
              # Independent decoders ensure the head and tail complete
              # their overlap before concatenation; no missing seam.
              filters=(
                f'[0:a]atrim=start={cutoff}:end={secs},asetpts=PTS-STARTPTS[tail];'
                f'[1:a]atrim=start=0:end={edge},asetpts=PTS-STARTPTS[head];'
                f'[2:a]atrim=start={edge}:end={cutoff},asetpts=PTS-STARTPTS[center];'
                f'[tail][head]acrossfade=d={fade_seconds}:c1=tri:c2=tri[seam];'
                '[center][seam]concat=n=2:v=0:a=1,aresample=32000[loop]'
              )
              out=base/(name+'-loop.wav')
              ff('-i',path,'-i',path,'-i',path,'-filter_complex',filters,'-map','[loop]',
                 '-ar','32000','-ac','1','-c:a','pcm_s16le',out)
              assert secs-fade_seconds-1 <= length(out) <= secs+1, (name,length(out))
              return out

          rain_loop=make_nature_loop('rain', 7)
          stream_loop=make_nature_loop('stream', 6)
          print('Field recordings:',length(rain_loop),length(stream_loop))

          # Distinct rain track: 14-min electric piano / ambient synth score,
          # smoothly crossfaded with itself to cover a 30-minute session.
          # This music is NOT the 36-minute piano track in the application.
          rain_music=base/'rain-music.mp3'
          rain_filter=(
              '[1:a][2:a]acrossfade=d=16:c1=tri:c2=tri[firstpair];'
              '[firstpair][3:a]acrossfade=d=16:c1=tri:c2=tri[theme];'
              '[theme]atrim=duration=1800,asetpts=PTS-STARTPTS,volume=0.60[music];'
              '[0:a]highpass=f=80,lowpass=f=7500,volume=0.60[rain];'
              '[music][rain]amix=inputs=2:duration=first:normalize=0,'
              'alimiter=limit=0.93,afade=t=in:st=0:d=5,'
              'afade=t=out:st=1794:d=6[out]'
          )
          ff('-stream_loop','-1','-i',rain_loop,
             '-i',rain_music,'-i',rain_music,'-i',rain_music,
             '-filter_complex',rain_filter,'-map','[out]',
             '-t','1800','-ar','44100','-ac','2',
             '-c:a','libmp3lame','-b:a','96k',
             '-metadata','title=Тихий дождь',
             '-metadata','artist=Kevin MacLeod (music); Mijesty (rain)',
             '-metadata','comment=Derived soundtrack CC BY-SA 4.0; see assets/MUSIC-LICENSE.md',
             'assets/rain-meditation.mp3')

          # Distinct stream track: separate 28-min tongue-drum and strings
          # composition. For final minutes, music recedes naturally and
          # the actual brook continues, so there is no abrupt replay.
          stream_filter=(
              '[1:a]volume=0.57,apad,atrim=duration=1800,'
              'afade=t=out:st=1658:d=24[music];'
              '[0:a]highpass=f=90,lowpass=f=6600,volume=0.65[brook];'
              '[music][brook]amix=inputs=2:duration=first:normalize=0,'
              'alimiter=limit=0.93,afade=t=in:st=0:d=5,'
              'afade=t=out:st=1794:d=6[out]'
          )
          ff('-stream_loop','-1','-i',stream_loop,
             '-i',base/'stream-music.mp3',
             '-filter_complex',stream_filter,'-map','[out]',
             '-t','1800','-ar','44100','-ac','2',
             '-c:a','libmp3lame','-b:a','96k',
             '-metadata','title=Лесной ручей',
             '-metadata','artist=Kevin MacLeod (music); Amada44 (stream)',
             '-metadata','comment=Derived soundtrack CC BY-SA 4.0; see assets/MUSIC-LICENSE.md',
             'assets/stream-meditation.mp3')

          for path in [Path('assets/rain-meditation.mp3'),Path('assets/stream-meditation.mp3')]:
              assert 1798 < length(path) < 1803, (path,length(path))
              assert 18_000_000 < path.stat().st_size < 30_000_000, path.stat().st_size
              print('Validated MP3:',path,'duration',length(path),'size',path.stat().st_size,'SHA',filehash(path))
          PY
      - name: Replace ocean track with two independent tracks and verify UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          def replace_one(old,new):
              global html
              count=html.count(old)
              if count != 1: raise AssertionError(f'Expected one old expression: {old[:90]} / count={count}')
              html=html.replace(old,new,1)

          replace_one(
              "{title:'Океанская гармония · музыка и волны', src:'assets/ocean-harmony.mp3', _builtin:true},",
              """{title:'Тихий дождь · атмосферная музыка и дождь', src:'assets/rain-meditation.mp3', _builtin:true},
              {title:'Лесной ручей · мелодии и журчание воды', src:'assets/stream-meditation.mp3', _builtin:true},"""
          )
          replace_one('allTracks.length === 2 + added','allTracks.length === 3 + added')
          # Keep the piano attribution, but replace the now-obsolete ocean
          # source / copyright notice with credits for both NEW tracks.
          new_note=(
              '<p class="track-attribution">'
              'Фортепиано: «Peace of Mind» — Kevin MacLeod, '
              '<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a>. '
              'Дождь: «Wisps of Whorls» — Kevin MacLeod, '
              '<a href="https://incompetech.com/music/royalty-free/index.html?isrc=USUAN1200082" target="_blank" rel="noopener noreferrer">музыка</a>; '
              '<a href="https://commons.wikimedia.org/wiki/File:Sound_of_light_rainfall.ogg" target="_blank" rel="noopener noreferrer">запись Mijesty</a>. '
              'Ручей: «Ethereal Relaxation» — Kevin MacLeod, '
              '<a href="https://incompetech.com/music/royalty-free/index.html?isrc=USUAN2100031" target="_blank" rel="noopener noreferrer">музыка</a>; '
              '<a href="https://commons.wikimedia.org/wiki/File:Sound_Effects_-_The_sound_of_a_small_stream.ogg" target="_blank" rel="noopener noreferrer">запись Amada44</a>. '
              'Обе новые звуковые смеси — '
              '<a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a>. '
              '</p>'
          )
          html,repl = re.subn(r'<p class="track-attribution">[\s\S]*?</p>', lambda _:new_note, html,count=1)
          assert repl==1
          assert 'assets/peace-of-mind.mp3' in html
          assert 'assets/rain-meditation.mp3' in html
          assert 'assets/stream-meditation.mp3' in html
          assert 'assets/ocean-harmony.mp3' not in html
          assert "querySelectorAll('.builtin-track')" in html
          assert "querySelectorAll('.del')" in html
          assert 'allTracks.length === 3 + added' in html

          js=[m for m in re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',html,flags=re.I) if m.strip()]
          assert len(js)==1, f'Expected one inline script; got {len(js)}'
          with tempfile.TemporaryDirectory() as d:
              sc=Path(d)/'app.js'
              sc.write_text(js[0],encoding='utf-8')
              subprocess.run(['node','--check',str(sc)],check=True)
          p.write_text(html,encoding='utf-8')
          print('App JavaScript syntax valid; separate built-ins + user tracks preserved')

          licenses=Path('assets/MUSIC-LICENSE.md')
          old=licenses.read_text(encoding='utf-8')
          old=old.split('## Ocean Harmony / Океанская гармония')[0].rstrip()+'\n\n'
          old += """## Тихий дождь — Rain Meditation

          Completely different music from the piano default and the stream version.

          - Music: **Wisps of Whorls**, Kevin MacLeod (incompetech.com), CC BY 4.0:
            https://incompetech.com/music/royalty-free/index.html?isrc=USUAN1200082
            https://creativecommons.org/licenses/by/4.0/
          - Authentic field recording: **Sound of light rainfall.ogg**, **Mijesty**, CC BY-SA 4.0:
            https://commons.wikimedia.org/wiki/File:Sound_of_light_rainfall.ogg
            https://creativecommons.org/licenses/by-sa/4.0/
          - Modifications: rain recording seam crossfaded and filtered; the independent Wisps of Whorls composition repeated with long crossfades; recordings blended, limited and faded into a 30-minute MP3.
          - **The resulting 30-minute audio remix** is shared under CC BY-SA 4.0, not the app source code.

          ## Лесной ручей — Stream Meditation

          Completely different music from the piano default and the rain version.

          - Music: **Ethereal Relaxation**, Kevin MacLeod (incompetech.com), CC BY 4.0:
            https://incompetech.com/music/royalty-free/index.html?isrc=USUAN2100031
            https://creativecommons.org/licenses/by/4.0/
          - Authentic field recording: **Sound Effects - The sound of a small stream.ogg**, **Amada44**, CC BY-SA 4.0:
            https://commons.wikimedia.org/wiki/File:Sound_Effects_-_The_sound_of_a_small_stream.ogg
            https://creativecommons.org/licenses/by-sa/4.0/
          - Modifications: stream recording seam crossfaded and filtered; 28-minute independent Ethereal Relaxation score combined with the brook, with the music gradually fading to the solo brook for the closing minutes; encoded as 30-minute MP3.
          - **The resulting 30-minute audio remix** is shared under CC BY-SA 4.0, not the app source code.

          Credits are given without any suggestion of creators' endorsement.
          """
          licenses.write_text(old,encoding='utf-8')
          readme=Path('README.md')
          doc=readme.read_text(encoding='utf-8')
          doc=doc.split('Дополнительно доступна **«Океанская гармония»**')[0].rstrip()
          doc += """

          Встроено **три самостоятельных музыкальных трека**: «Спокойствие · фортепиано» (оригинальный Peace of Mind); «Тихий дождь» (другая композиция Wisps of Whorls и настоящий дождь); «Лесной ручей» (отдельная композиция Ethereal Relaxation и настоящий ручей). Никакая музыка из первого трека не используется в двух остальных. Полные авторские атрибуции и условия использования — [assets/MUSIC-LICENSE.md](assets/MUSIC-LICENSE.md).
          """
          readme.write_text(doc,encoding='utf-8')
          PY
          git rm -f assets/ocean-harmony.mp3
          # The old "quiet" WAV is unused and replaced by actual music.
          git rm -f assets/quiet-harmony.wav
      - name: Commit verified app and licensed recordings to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md assets/MUSIC-LICENSE.md assets/rain-meditation.mp3 assets/stream-meditation.mp3
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Provide three genuinely different meditation tracks: piano, rain, stream"
          git pull --rebase origin main
          git push origin HEAD:main
