name: Keep only piano built-in meditation music

on:
  push:
    branches: [main]
    paths: ['.github/workflows/keep-only-piano.yml']

permissions:
  contents: write

jobs:
  restore-single-track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Remove rain and stream from the app while keeping personal MP3 support
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/peace-of-mind.mp3
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          path=Path('index.html')
          html=path.read_text(encoding='utf-8')
          def exactly_once(old,new):
              global html
              num=html.count(old)
              if num!=1:
                  raise AssertionError(f'Expected one occurrence, got {num}: {old[:90]}')
              html=html.replace(old,new,1)

          exactly_once(
              "        {title:'Тихий дождь · атмосферная музыка и дождь', src:'assets/rain-meditation.mp3', _builtin:true},\n",
              ''
          )
          exactly_once(
              "    {title:'Лесной ручей · мелодии и журчание воды', src:'assets/stream-meditation.mp3', _builtin:true},\n",
              ''
          )
          exactly_once('allTracks.length === 3 + added','allTracks.length === 1 + added')

          credit=(
              '<p class="track-attribution">Встроенная музыка: '
              '«Peace of Mind» — Kevin MacLeod '
              '(<a href="https://incompetech.com/music/royalty-free/index.html?isrc=USUAN1200099" '
              'target="_blank" rel="noopener noreferrer">оригинальная композиция</a>). '
              'Лицензия <a href="https://creativecommons.org/licenses/by/4.0/" '
              'target="_blank" rel="noopener noreferrer">CC BY 4.0</a>. '
              'Добавлено плавное вступление.</p>'
          )
          html,n=re.subn(r'<p class="track-attribution">[\s\S]*?</p>',lambda _:credit,html,count=1)
          assert n==1
          assert html.count("assets/peace-of-mind.mp3")==1
          for removed in ('assets/rain-meditation.mp3','assets/stream-meditation.mp3',
                          'Океанская гармония','Тихий дождь','Лесной ручей'):
              assert removed not in html, f'Obsolete track reference: {removed}'
          assert '...userTracks.map(t =>' in html, 'Custom tracks mapping must remain'
          assert "querySelectorAll('.del')" in html, 'Custom track deletion must remain'
          assert 'dbAddTrack(file.name, file)' in html, 'Personal MP3 upload must remain'
          assert 'allTracks.length === 1 + added' in html

          scripts=[m for m in re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',html,flags=re.I) if m.strip()]
          assert len(scripts)==1
          with tempfile.TemporaryDirectory() as tmp:
              script=Path(tmp)/'application.js'
              script.write_text(scripts[0],encoding='utf-8')
              subprocess.run(['node','--check',str(script)],check=True)
          path.write_text(html,encoding='utf-8')

          license_path=Path('assets/MUSIC-LICENSE.md')
          license_text=license_path.read_text(encoding='utf-8')
          assert license_text.count('## Тихий дождь — Rain Meditation')==1
          license_path.write_text(license_text.split('## Тихий дождь — Rain Meditation')[0].rstrip()+'\n',encoding='utf-8')

          readme_path=Path('README.md')
          readme=readme_path.read_text(encoding='utf-8')
          assert readme.count('Встроено **три самостоятельных музыкальных трека**')==1
          readme=readme.split('Встроено **три самостоятельных музыкальных трека**')[0].rstrip()+'\n'
          readme_path.write_text(readme,encoding='utf-8')
          print('PASS: one built-in piano recording, MP3 upload preserved, syntax valid')
          PY
          git rm assets/rain-meditation.mp3 assets/stream-meditation.mp3
      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md assets/MUSIC-LICENSE.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Keep only the original built-in piano meditation track"
          git pull --rebase origin main
          git push origin HEAD:main
