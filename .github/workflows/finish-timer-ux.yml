name: Harden meditation timer and polish practice controls

on:
  push:
    branches: [main]
    paths: ['.github/workflows/finish-timer-ux.yml']

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Make targeted timer, music and interface fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def one(before, after):
              global s
              count=s.count(before)
              if count != 1: raise AssertionError(f'Expected one match ({count}): {before[:100]!r}')
              s=s.replace(before,after,1)
          def area(start,end,new):
              global s
              assert s.count(start)==1 and s.count(end)==1,(start,end)
              a=s.index(start); b=s.index(end,a)
              s=s[:a]+new+s[b:]

          # Accessibility, predictable tap targets, and the time selector.
          one('width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no',
              'width=device-width, initial-scale=1')
          for name,target in [('practice','practicePicker'),('rhythm','rhythmPicker'),('time','presets')]:
              old='<div class="setting-header" id="'+name+'Header">'
              new='<button type="button" class="setting-header" id="'+name+'Header" aria-expanded="false" aria-controls="'+target+'">'
              one(old,new)
              anchor='<div class="setting-options slider-mode" id="'+target+'">'
              pos=s.index(anchor)
              before=s[:pos]
              last=before.rfind('        </div>\n      </div>')
              assert last!=-1 and pos-last<90
              # Close the button and enclosing block instead of two divs.
              s=s[:last]+s[last:].replace('        </div>\n      </div>\n','        </button>\n      </div>\n',1)
          one('<input type="range" class="custom-range" id="practiceSlider"',
              '<input type="range" class="custom-range" id="practiceSlider" aria-label="Тип медитации"')
          one('<input type="range" class="custom-range" id="rhythmSlider"',
              '<input type="range" class="custom-range" id="rhythmSlider" aria-label="Ритм дыхания"')
          one('<input type="range" class="custom-range" id="timeSlider"',
              '<input type="range" class="custom-range" id="timeSlider" aria-label="Длительность медитации в минутах"')
          one('          </div>\n        </div>\n      </div>\n    </div>\n\n    <div class="timer-display" id="timerDisplay">',
              '''          </div>
          <label class="time-exact-label" for="timeExactInput">Точно, минут
            <input type="number" inputmode="numeric" id="timeExactInput" min="1" max="180" step="1" value="10">
          </label>
        </div>
      </div>
    </div>

    <div class="timer-display" id="timerDisplay">''')
          one('          </div>\n        </div>\n      </div>\n    </div>\n\n    <div class="setting-block" id="rhythmBlock">',
              '''          </div>
          <button type="button" id="scanChimeButton" class="quiet-toggle" aria-pressed="false" hidden>♪ Сигнал смены этапов: выкл.</button>
        </div>
      </div>
    </div>

    <div class="setting-block" id="rhythmBlock">''')
          one('<div class="breath-hint" id="breathHint"></div>',
              '<div class="breath-hint" id="breathHint" role="status" aria-live="off"></div>')
          for name, label in [
            ('btnTracks','Выбрать музыку'),('btnPrevTrack','Предыдущий трек'),
            ('btnMain','Начать или приостановить медитацию'),
            ('btnNextTrack','Следующий трек'),('btnAddTrack','Добавить свою музыку')
          ]:
              old='id="'+name+'" title='
              new='id="'+name+'" aria-label="'+label+'" title='
              one(old,new)
          for field in ['rIn','rOut','rHold','rEmpty']:
              one('id="'+field+'" min="1" max="30"' if field in ('rIn','rOut') else 'id="'+field+'" min="0" max="30"',
                  'id="'+field+'" min="1" max="20"' if field in ('rIn','rOut') else 'id="'+field+'" min="0" max="20"')
          one('  .setting-block.hidden { display: none; }',
              '''  .setting-block.hidden { display: none; }
  [hidden] { display:none !important; }
  .setting-header { width:100%; background:transparent; border:0; color:inherit; font:inherit; text-align:left; }
  .setting-header:focus-visible, .quiet-toggle:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .quiet-toggle { width:100%; padding:10px 12px; margin-top:8px; border:1px solid rgba(164,99,242,.3);
    border-radius:10px; background:rgba(164,99,242,.08); color:#e7d8f7; cursor:pointer; font:inherit; font-size:12px; text-align:left; }
  .time-exact-label { display:flex; align-items:center; justify-content:space-between; gap:12px;
    color:#a7a9be; font-size:12px; padding:12px 2px 2px; }
  #timeExactInput { width:86px; padding:8px 10px; border:1px solid rgba(164,99,242,.35);
    border-radius:9px; background:#1c1c38; color:#fff; font:inherit; font-size:16px; text-align:center; }
  @media (prefers-reduced-motion: reduce) {
    .screen.active { animation:none; }
    * { scroll-behavior:auto !important; }
  }''')

          # Accessibility: synchronize accordion expanded states even when another closes.
          one('function renderPracticeUI() {',
              '''function syncSettingsExpanded() {
  for (const [header, block] of [
    ['practiceHeader',practiceBlock],['rhythmHeader',rhythmBlock],['timeHeader',timeBlock]
  ]) document.getElementById(header).setAttribute('aria-expanded',String(block.classList.contains('open')));
}

function renderPracticeUI() {''')
          one("  rhythmBlock.classList.toggle('hidden', practiceMode === 'scan');",
              """  rhythmBlock.classList.toggle('hidden', practiceMode === 'scan');
  const chime = document.getElementById('scanChimeButton');
  chime.hidden = practiceMode !== 'scan';
  chime.textContent = '♪ Сигнал смены этапов: ' + (scanChimeEnabled ? 'вкл.' : 'выкл.');
  chime.setAttribute('aria-pressed', String(scanChimeEnabled));""")
          for unique in [
              "  if (tg) tg.HapticFeedback?.selectionChanged();\n});\n\npracticeSlider.addEventListener('input'",
              "  if (tg) tg.HapticFeedback?.selectionChanged();\n});\n\nrhythmSlider.addEventListener('input'",
              "  if (tg) tg.HapticFeedback?.selectionChanged();\n});\n\ntimeSlider.addEventListener('input'"
          ]:
              one(unique,unique.replace('  if (tg)', '  syncSettingsExpanded();\n  if (tg)'))
          one("  const timeSlider = document.getElementById('timeSlider');",
              "  const timeSlider = document.getElementById('timeSlider');") if False else None
          one("const timeSlider = document.getElementById('timeSlider');",
              "const timeSlider = document.getElementById('timeSlider');\nconst timeExactInput = document.getElementById('timeExactInput');")
          one("  timeBigVal.textContent = min;",
              "  timeBigVal.textContent = min;\n  timeExactInput.value = String(min);")

          area("timeSlider.addEventListener('change', () => {",
               "/* ---------- Треки ---------- */",
          """function commitPracticeMinutes(min) {
  if (!Number.isInteger(min) || min < MIN_TIME || min > MAX_TIME) {
    showToast('Выбери длительность от 1 до 180 минут');
    renderPresets();
    return;
  }
  if (min === currentPresetMin) { renderPresets(); return; }
  if (!confirmTimerReset()) { renderPresets(); return; }
  currentPresetMin = min;
  storageSet('activePreset', String(min));
  resetTimer(min * 60);
  renderPresets();
}
timeSlider.addEventListener('change', () => {
  commitPracticeMinutes(Number(timeSlider.value));
});
timeExactInput.addEventListener('change', () => {
  commitPracticeMinutes(Number(timeExactInput.value));
});
timeExactInput.addEventListener('keydown', event => {
  if (event.key === 'Enter') timeExactInput.blur();
});
quickPresets.addEventListener('click', event => {
  const button = event.target.closest('button[data-min]');
  if (!button) return;
  commitPracticeMinutes(Number(button.dataset.min));
  if (tg) tg.HapticFeedback?.selectionChanged();
});

""")

          # Chime is opt-in. No generated background ambience; only a short
          # sound on step transitions, driven by the same elapsed-time clock.
          one("/* ---------- Скан тела ---------- */",
              '''/* ---------- Скан тела ---------- */
let scanChimeEnabled = false;
let scanAudibleStep = -1;
let scanChimeContext = null;
function armScanChime() {
  if (!scanChimeEnabled) return;
  const Context = window.AudioContext || window.webkitAudioContext;
  if (!Context) return;
  try {
    if (!scanChimeContext) scanChimeContext = new Context();
    if (scanChimeContext.state === 'suspended') {
      void scanChimeContext.resume().catch(() => {});
    }
  } catch(e) { console.warn('Chime unavailable:',e); }
}
function playScanChime() {
  if (!scanChimeEnabled || document.hidden || !timerRunning) return;
  try {
    armScanChime();
    if (!scanChimeContext || scanChimeContext.state !== 'running') return;
    const ctx = scanChimeContext;
    const at = ctx.currentTime;
    const tone = ctx.createOscillator();
    const volume = ctx.createGain();
    tone.type = 'sine';
    tone.frequency.setValueAtTime(740,at);
    tone.frequency.exponentialRampToValueAtTime(590,at+0.38);
    volume.gain.setValueAtTime(0.0001,at);
    volume.gain.exponentialRampToValueAtTime(0.018,at+0.025);
    volume.gain.exponentialRampToValueAtTime(0.0001,at+0.46);
    tone.connect(volume).connect(ctx.destination);
    tone.start(at);
    tone.stop(at+0.48);
    tone.onended = () => { tone.disconnect(); volume.disconnect(); };
  } catch(e) { console.warn('Chime playback:',e); }
}
''')
          one("  const res = breathing(isIdle ? ambientSeconds : secondsInCycle);",
              """  const res = breathing(isIdle ? ambientSeconds : secondsInCycle);
  if (!isIdle && res.phaseName === 'scan') {
    if (scanAudibleStep >= 0 && scanAudibleStep !== res.scanIdx) playScanChime();
    scanAudibleStep = res.scanIdx;
  } else scanAudibleStep = -1;""")
          one("  lastHintState = null;\n  if (canAnimateOrb()) startOrbAnimation();\n  if (audioEl && !audioEl.paused)",
              "  lastHintState = null;\n  scanAudibleStep = -1;\n  if (canAnimateOrb()) startOrbAnimation();\n  if (audioEl && !audioEl.paused)")
          one("  timerRunning = true;\n  timerStartMs = performance.now();",
              "  timerRunning = true;\n  timerStartMs = performance.now();\n  armScanChime();\n  armTimerDeadline();")
          one("const PRACTICE_MODES = ['breath', 'scan'];",
              """const PRACTICE_MODES = ['breath', 'scan'];
document.getElementById('scanChimeButton').addEventListener('click', () => {
  scanChimeEnabled = !scanChimeEnabled;
  storageSet('scanChime',scanChimeEnabled ? '1' : '0');
  armScanChime();
  renderPracticeUI();
});""")

          # System reduced motion retains the 60 FPS breathing universe;
          # only the spatial drift and decorative movement are suppressed.
          one("function drawUniverse(level, progress, t) {\n",
              "function drawUniverse(level, progress, t) {\n  if (motionPreference.matches) t = 0;\n")

          # Deadline fallback + audio media clock supplements throttled intervals;
          # do not pretend browser timers run perfectly while an app is killed.
          one("let timerInterval = null;",
              """let timerInterval = null;
let timerDeadlineTimeout = null;
function clearTimerDeadline() {
  if (timerDeadlineTimeout !== null) clearTimeout(timerDeadlineTimeout);
  timerDeadlineTimeout = null;
}
function armTimerDeadline() {
  clearTimerDeadline();
  if (!timerRunning) return;
  timerDeadlineTimeout = setTimeout(() => {
    if (!timerRunning) return;
    if (currentElapsed() >= timerTotalSec) finishTimer();
    else armTimerDeadline();
  }, Math.max(30,Math.ceil((timerTotalSec-currentElapsed())*1000)));
}""")
          one("function pauseTimer() {\n  if (!timerRunning) return;",
              "function pauseTimer() {\n  if (!timerRunning) return;\n  clearTimerDeadline();")
          one("function finishTimer() {\n  if (timerDone) return;\n  clearSavedPractice();",
              "function finishTimer() {\n  if (timerDone) return;\n  clearTimerDeadline();\n  clearSavedPractice();")
          one("function resetTimer(newTotalSec, preserveRecovery = false) {\n  if (!preserveRecovery) clearSavedPractice();",
              "function resetTimer(newTotalSec, preserveRecovery = false) {\n  clearTimerDeadline();\n  if (!preserveRecovery) clearSavedPractice();")
          one("  if (!audioEl.paused) fadeAudioTo(0, 4500, true);",
              """  if (!audioEl.paused) {
    if (document.hidden) {
      stopAudioFade(); audioEl.pause(); audioEl.volume = MUSIC_VOLUME;
    } else fadeAudioTo(0, 4500, true);
  }""")
          one("function fadeAudioTo(target, ms = 3500, pauseAtEnd = false) {\n  const token = ++fadeToken;",
              """function fadeAudioTo(target, ms = 3500, pauseAtEnd = false) {
  const token = ++fadeToken;
  if (document.hidden) {
    audioEl.volume = target;
    if (pauseAtEnd) { audioEl.pause(); audioEl.volume = MUSIC_VOLUME; }
    return;
  }""")
          one("audioEl.addEventListener('play', () => updateTrackStatus());",
              """audioEl.addEventListener('play', () => updateTrackStatus());
audioEl.addEventListener('waiting', () => {
  if (!audioEl.paused) updateTrackStatus('♫ Загрузка музыки…');
});
audioEl.addEventListener('stalled', () => {
  if (!audioEl.paused) updateTrackStatus('♫ Ожидание сети…');
});
audioEl.addEventListener('playing', () => updateTrackStatus());
audioEl.addEventListener('timeupdate', () => {
  if (timerRunning && currentElapsed() >= timerTotalSec) finishTimer();
});""")
          one("  if (document.hidden) { saveActivePractice(); stopOrbAnimation(); }",
              """  if (document.hidden) {
    if (timerRunning && currentElapsed() >= timerTotalSec) finishTimer();
    saveActivePractice();
    stopOrbAnimation();
  }""")
          one("  const [streakVal, cpVal, acVal, arVal, apVal, sessVal, logVal, pmVal, uiVal, urVal] = await Promise.all([",
              "  const [streakVal, cpVal, acVal, arVal, apVal, sessVal, logVal, pmVal, uiVal, urVal, chimeVal] = await Promise.all([")
          one("    storageGetP('userRhythms')\n  ]);",
              "    storageGetP('userRhythms'),\n    storageGetP('scanChime')\n  ]);")
          one("  if (pmVal === 'scan' || pmVal === 'breath') practiceMode = pmVal;",
              "  if (pmVal === 'scan' || pmVal === 'breath') practiceMode = pmVal;\n  scanChimeEnabled = chimeVal === '1';")

          # Match file extensions as a fallback for OSes that omit MIME.
          one("if (!file.type.startsWith('audio/'))",
              "if (!file.type.startsWith('audio/') && !/\\.(mp3|m4a|aac|ogg|wav|flac)$/i.test(file.name))")

          # Strip obsolete no-ops and progress-gating remnants; leave the
          # real statistics function in use without changing its values.
          one("""function isChakraUnlocked(idx, progress) {
  return idx >= 0 && idx < CHAKRAS.length;
}
""","")
          one("function getTotalXP()", "function getTotalMeditationMinutes()")
          one("const totalMinutes = getTotalXP();", "const totalMinutes = getTotalMeditationMinutes();")
          a=s.index('function renderProgress() {')
          b=s.index('\n\n',s.index('\n}',a)+2)
          assert s.count('renderProgress()')==1
          s=s[:a]+s[b+2:]
          one("""    if (chakraKey === currentChakra) {

    }
""","")
          one("""      if (chakraKey === currentChakra) {

      }
""","")

          # Private, device-local diary export. No upload, sharing, or telemetry.
          one('<div class="profile-tabs">',
              '''<div class="profile-actions">
    <button type="button" id="exportJournalBtn" class="quiet-toggle">↓ Сохранить мой дневник</button>
  </div>
  <div class="profile-tabs">''')
          one("/* ---------- Профиль ---------- */",
              """/* ---------- Профиль ---------- */
document.getElementById('exportJournalBtn').addEventListener('click', () => {
  try {
    const data = {
      format: 'meditation-journal', version: 1, exportedAt: new Date().toISOString(),
      sessions: sessionLog, streak
    };
    const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'meditation-journal-' + todayStr() + '.json';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url),60000);
    showToast('Дневник подготовлен к сохранению','success');
  } catch(e) {
    console.warn('Journal export:',e);
    showToast('Не удалось экспортировать дневник');
  }
});""")

          # Internal status feedback for failed audio, without breaking timer.
          one("    if (allTracks.length) updateTrackStatus('Не удаётся прочитать аудиофайл');",
              """    if (allTracks.length) {
      updateTrackStatus('Не удаётся прочитать аудиофайл');
      showToast('Проблема с музыкой. Практика продолжится без звука');
    }""")

          assert s.count('assets/peace-of-mind.mp3')==1
          assert 'assets/rain-meditation.mp3' not in s
          assert 'assets/stream-meditation.mp3' not in s
          assert 'scanStepAt(secondsInCycle, timerTotalSec)' in s
          assert s.count('function armTimerDeadline()')==1
          assert s.count('function playScanChime()')==1
          p.write_text(s,encoding='utf-8')
          print('Applied timer+sound reliability, scan chime, exact minutes, accessibility, journal export, cleanup')
          PY
      - name: Ensure syntax and old features remain intact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          js=[m for m in re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',html,re.I) if m.strip()]
          assert len(js)==1
          Path('/tmp/app.js').write_text(js[0],encoding='utf-8')
          ids=re.findall(r'\bid="([^"]+)"',html)
          assert len(ids)==len(set(ids)), 'Duplicated IDs'
          for name in ['practiceHeader','rhythmHeader','timeHeader']:
              assert '<button type="button" class="setting-header" id="'+name+'"' in html
          for name in ['scanChimeButton','timeExactInput','exportJournalBtn']:
              assert 'id="'+name+'"' in html
          assert html.count('<style>')==1 and html.count('</style>')==1
          assert 'function mergeSessionLogs' in html and 'meditation_active_practice_v1' in html
          PY
          node --check /tmp/app.js
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const js=fs.readFileSync('/tmp/app.js','utf8');
          const helper=js.match(/function scanStepAt\([^]*?\n\}/)[0];
          const ctx={SCAN_PARTS:Array.from({length:12})};
          vm.runInNewContext(helper+';this.test=scanStepAt',ctx);
          for(const total of [60,300,600,3600,10800]){
            for(let i=0;i<12;i++)assert.equal(ctx.test((i+0.5)*total/12,total).partIdx,i);
            assert.equal(ctx.test(total,total).partIdx,11);
          }
          assert(js.includes('function armTimerDeadline()'));
          assert(js.includes("audioEl.addEventListener('timeupdate'"));
          assert(js.includes('playScanChime()'));
          assert(js.includes('timeExactInput.addEventListener'));
          console.log('PASS: syntax, timer deadline/media events, body scan 12 steps, controls');
          JS
      - name: Publish to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finish-timer-ux.yml
          git add index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Harden timer and audio; add optional scan cues and accessible controls"
          git pull --rebase origin main
          git push origin HEAD:main
