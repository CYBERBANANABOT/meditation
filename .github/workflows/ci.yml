name: Meditation regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        shell: bash
        run: |
          if test -f assets/ui.js; then
            for file in assets/core.js assets/visualizer.js assets/session.js assets/ui.js assets/journal-backup.js assets/yoga-mannequin.js assets/yoga-prototype.js; do
              test -s "$file"
              node --check "$file"
            done
          elif test -f assets/app.js; then
            node --check assets/app.js
          else
            python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          js=[m for m in re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',html,re.I) if m.strip()]
          assert len(js)==1,'Exactly one inline application script expected'
          Path('/tmp/meditation-app.js').write_text(js[0],encoding='utf-8')
          PY
            node --check /tmp/meditation-app.js
          fi
      - name: Exercise timer, audio and journal regression tests
        run: node --test tests/smoke.cjs
      - name: Test both tabs in real mobile-sized Chromium
        shell: bash
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.55.0
          command -v google-chrome
          node tests/mobile-layout.cjs
      - name: Test standalone 3D yoga instructor on mobile
        shell: bash
        run: |
          node tests/yoga-prototype.cjs
      - name: Preserve mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-screenshots
          path: |
            artifacts/layout/
            artifacts/yoga/
          if-no-files-found: ignore
          retention-days: 5
      - name: Check patch whitespace
        run: git diff --check
